name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas scikit-learn imbalanced-learn joblib fastapi 'uvicorn[standard]' pytest httpx
      - run: python -m pytest -q
