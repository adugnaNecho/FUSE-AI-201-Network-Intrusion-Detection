name: Refresh live NIDS statistics
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-nids-readme
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh marked README block
        env:
          LIVE_STATS_API_URL: ${{ secrets.LIVE_STATS_API_URL }}
          LIVE_STATS_API_TOKEN: ${{ secrets.LIVE_STATS_API_TOKEN }}
        run: python scripts/update_live_readme.py
      - name: Commit changed statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "No README change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh live NIDS telemetry statistics"
          git push
